name: AOI CI & Scaffold Parity Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Deterministic Invariant & Scaffold Parity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: aoi_apps/pnpm-lock.yaml

      # The repo root declares no dependencies: it is a script runner, and the
      # dashboard owns its own workspace under `aoi_apps/`. Installing the root
      # would resolve nothing — the dashboard is what has to be installed, and
      # it is the only thing with a lockfile to freeze.
      - name: Install Dashboard Dependencies
        run: cd aoi_apps/agentic-ops-dashboard && pnpm install --frozen-lockfile

      - name: Run Global Test Suite & Scaffold Parity Check
        run: pnpm test

      # El trinquete de mutación tarda minutos, así que quedó fuera de `pnpm test`
      # para no castigar cada corrida local — y con eso dejó de dispararse en
      # ningún lado. Un trinquete que nadie acciona no trinca: la cobertura puede
      # aflojarse sin que nada lo note. Acá sí corre, en cada push y cada PR.
      - name: Mutation Ratchet (la cobertura no puede aflojarse)
        run: pnpm aoi:mutation

      - name: Build Production Dashboard
        run: pnpm build:dashboard
